# TEMPLATE: Replace <ENV> with: dev, test, or prod
# Replace <BRANCH> with the trigger branch
# Replace <STACK_NAME> and <REGION> with actual values

name: Deploy to <ENV>

on:
  push:
    branches: [<BRANCH>]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: <REGION>
  SAM_STACK_NAME: <STACK_NAME>-<ENV>
  PYTHON_VERSION: '3.12'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: <ENV>
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM validate
        run: sam validate

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              RuntimeEnvironment=<ENV> \
              LambdaIamRoleArn=${{ secrets.LAMBDA_IAM_ROLE_ARN }} \
              AppSecurityGroupIds=${{ secrets.SECURITY_GROUP_IDS }} \
              AppSubnetIds=${{ secrets.SUBNET_IDS }}
